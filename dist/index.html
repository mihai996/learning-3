<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta
      name="description"
      content="Materiale de studiu pentru Microbiologie, Biochimie, Genetică și Pedologie"
    />
    <title>Biblioteca pentru examene</title>
    <link rel="stylesheet" href="assets/styles.css?v=2026-10-10-1" />
  </head>
  <body>
    <header class="topbar">
      <button
        class="menu-button"
        id="menu-button"
        type="button"
        aria-label="Deschide cuprinsul"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <a class="brand" href="#" aria-label="Pagina principală">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span>Biblioteca pentru examene</span>
      </a>
    </header>

    <div class="page-shell">
      <aside class="sidebar" id="sidebar" aria-label="Cuprins">
        <div class="sidebar-heading">
          <span>Cuprins</span>
          <button class="close-button" id="close-button" type="button" aria-label="Închide cuprinsul">×</button>
        </div>
        <nav id="course-navigation" aria-label="Cursuri"></nav>
      </aside>

      <button class="backdrop" id="backdrop" type="button" aria-label="Închide cuprinsul"></button>

      <main class="content" id="content" tabindex="-1">
        <article class="article" id="article" aria-live="polite">
          <p class="eyebrow">Bibliotecă de studiu</p>
          <h1>Materialele tale, într-un singur loc.</h1>
          <p class="lead">
            Alege un curs și o temă din cuprins. Structura este pregătită pentru completarea treptată a informațiilor.
          </p>
          <div class="course-list" id="course-list" aria-label="Cursuri disponibile"></div>
        </article>
      </main>
    </div>

    <script src="assets/app-v2.js" defer></script>
  </body>
</html>
